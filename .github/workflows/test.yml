# 测试与静态检查流程：装好 Go 工具链，跑 `go vet`、格式检查、`go test` 与覆盖率门槛。
#
# 每一步都调用 `Makefile` 里的目标，而不是把命令抄进 workflow。这样 CI 的失败在本机
# 用一条 `make check` 就能复现，也不会出现「CI 的命令和 Makefile 的命令悄悄不一致」的
# 情况。门槛本身在 `scripts/check_coverage.sh`（逐包语句覆盖率 ≥ 70%，生成代码包
# `takler_protocol` 排除在外）。
#
# 目标拆成多个 step 而不是一次 `make check`，是为了让运行摘要直接指出是哪一环失败。
#
# Go 版本跟随 `go.mod` 的 `go` 指令：`setup-go` 的 `go-version-file` 从该文件读取，
# 免得两处版本号各自漂移。

name: test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    name: test (Go)

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        # 跨 workflow 复用模块下载与构建缓存，缓存键跟随 `go.sum`。
        cache-dependency-path: go.sum
    - name: Vet
      run: make vet
    - name: Check formatting with gofmt
      run: make fmt-check
    - name: Test
      run: make test
    # cover 写出被门槛覆盖的那些包的合并 profile，并打印总覆盖率，便于在日志里直接
    # 看到数字；profile 作为构件上传，可以下载后用 `go tool cover -html` 逐行查看。
    - name: Collect coverage
      run: make cover
    - name: Coverage gate
      run: make cover-check
    - name: Upload coverage profile
      uses: actions/upload-artifact@v4
      # 即使门槛失败也要留下 profile——覆盖率不够时恰恰最需要看它。若更早的步骤就挂了
      # （比如测试失败），profile 可能压根没生成，这时只警告不再叠加一次失败。
      if: always()
      with:
        name: coverage-profile
        path: coverage.out
        if-no-files-found: warn

  proto-drift:

    name: proto drift check

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    # takler 仓的 `src/takler/server/protocol/takler.proto` 是协议的唯一事实来源，
    # 漂移检查需要拿到它：检出到 `takler-src/`，经 TAKLER_REPO 传给脚本。
    - name: Check out the takler repo (proto source of truth)
      uses: actions/checkout@v4
      with:
        repository: cemc-oper/takler
        path: takler-src
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum
    # protoc 来自 takler 仓锁定的 uv 环境（dev 组的 grpcio-tools），脚本里以
    # `uv run --project` 调用，因此这里只需装 uv 本身。
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        enable-cache: true
    # 两层校验：`takler_protocol/takler.proto` 与事实来源逐字节一致；生成代码重新
    # 生成后 diff 为空。任一端 proto 落后都会让本 job 变红。
    - name: Proto drift check
      run: TAKLER_REPO="${{ github.workspace }}/takler-src" make proto-check

  http-contract:

    # HTTP 通道的跨语言契约测试（M3 任务 10）：对真实 takler 服务端的 HTTP 端口跑
    # Go 客户端的全命令矩阵，逐条断言退出码与输出行（scripts/http_contract.sh）。
    # 服务端来自 takler 仓的检出（与 proto-drift 同一模式），经 uv 以 http extra
    # 启动；客户端是本仓构建出的二进制。

    name: http contract

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Check out the takler repo (the server)
      uses: actions/checkout@v4
      with:
        repository: cemc-oper/takler
        path: takler-src
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum
    - name: Build the client
      run: make all
    # 服务端由 takler 仓锁定的 uv 环境运行，这里只需装 uv 本身。
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        enable-cache: true
    - name: Run the HTTP command matrix against a real server
      run: TAKLER_REPO="${{ github.workspace }}/takler-src" make http-contract
