# 测试与静态检查流程：装好 Go 工具链，跑 `go vet`、格式检查、`go test` 与覆盖率门槛。
#
# 每一步都调用 `Makefile` 里的目标，而不是把命令抄进 workflow。这样 CI 的失败在本机
# 用一条 `make check` 就能复现，也不会出现「CI 的命令和 Makefile 的命令悄悄不一致」的
# 情况。门槛本身在 `scripts/check_coverage.sh`（逐包语句覆盖率 ≥ 70%，生成代码包
# `takler_protocol` 排除在外）。
#
# 目标拆成多个 step 而不是一次 `make check`，是为了让运行摘要直接指出是哪一环失败。
#
# Go 版本跟随 `go.mod` 的 `go` 指令：`setup-go` 的 `go-version-file` 从该文件读取，
# 免得两处版本号各自漂移。

name: ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:
    inputs:
      peer_sha:
        description: "Paired repository full commit SHA (empty uses main)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:

    name: ci (Go)

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        # 跨 workflow 复用模块下载与构建缓存，缓存键跟随 `go.sum`。
        cache-dependency-path: go.sum
    - name: Vet
      run: make vet
    - name: Check formatting with gofmt
      run: make fmt-check
    - name: Test
      run: make test
    # cover 写出被门槛覆盖的那些包的合并 profile，并打印总覆盖率，便于在日志里直接
    # 看到数字；profile 作为构件上传，可以下载后用 `go tool cover -html` 逐行查看。
    - name: Collect coverage
      run: make cover
    - name: Coverage gate
      run: make cover-check
    - name: Upload coverage profile
      uses: actions/upload-artifact@v4
      # 即使门槛失败也要留下 profile——覆盖率不够时恰恰最需要看它。若更早的步骤就挂了
      # （比如测试失败），profile 可能压根没生成，这时只警告不再叠加一次失败。
      if: always()
      with:
        name: coverage-profile
        path: coverage.out
        if-no-files-found: warn

  paired-contract:
    name: paired protocol and CLI contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        path: takler-client
        fetch-depth: 0
        persist-credentials: false
    - name: Select peer revision
      id: peer
      env:
        REQUESTED_SHA: ${{ inputs.peer_sha }}
      run: |
        peer_sha="$REQUESTED_SHA"
        if [[ -n "$peer_sha" && ! "$peer_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "Peer revision must be a full lowercase commit SHA" >&2
          exit 1
        fi
        echo "ref=${peer_sha:-main}" >> "$GITHUB_OUTPUT"
        echo "sha=$peer_sha" >> "$GITHUB_OUTPUT"
    - name: Check out paired repository
      uses: actions/checkout@v4
      with:
        repository: cemc-oper/takler
        ref: ${{ steps.peer.outputs.ref }}
        path: takler
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-go@v5
      with:
        go-version-file: takler-client/go.mod
        cache-dependency-path: takler-client/go.sum
    - uses: astral-sh/setup-uv@v10.0.1
      with:
        python-version: "3.11"
        enable-cache: true
        cache-dependency-glob: takler/uv.lock
    - name: Record actual revisions
      run: |
        for repo in takler takler-client; do
          revision="$(git -C "$repo" rev-parse HEAD)"
          echo "$repo: $revision" | tee -a "$GITHUB_STEP_SUMMARY"
        done
    - name: Install locked Python dependencies
      working-directory: takler
      run: uv sync --locked --all-groups --extra http
    - name: Check Python proto freshness and cross-repository drift
      working-directory: takler
      env:
        TAKLER_CLIENT_REPO: ../takler-client
      run: bash scripts/check_proto.sh
    - name: Check Go proto and shared wire contracts
      working-directory: takler-client
      env:
        TAKLER_REPO: ../takler
      run: make proto-check wire-check
    - name: Confirm drift gates reject mismatched peers
      working-directory: takler-client
      env:
        TAKLER_REPO: ../takler
      run: bash scripts/check_drift_negative.sh
    - name: Run HTTP command matrix
      working-directory: takler-client
      env:
        TAKLER_REPO: ../takler
      run: make http-contract
    - name: Run both clients over gRPC and HTTP
      working-directory: takler-client
      env:
        TAKLER_REPO: ../takler
      run: make load-contract replace-contract show-contract query-a-contract
    - name: Run child identity and service state matrix
      working-directory: takler
      env:
        TAKLER_SHOW_GO_CLIENT: ../takler-client/bin/takler_client
      run: |
        uv run --no-sync pytest -q tests/packaging/test_ci_workflow.py tests/integration/test_child_identity_matrix.py tests/integration/test_server_state_cli_matrix.py tests/integration/test_show_cli_contract.py
