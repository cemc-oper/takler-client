# 测试与静态检查流程：装好 Go 工具链，跑 `go vet`、格式检查、`go test` 与覆盖率门槛。
#
# 日常作业与 `make check-fast` 使用同一组 Makefile 目标。完整配对通过手动运行
# 或本地 `make check-paired` 执行。覆盖率门槛在 `scripts/check_coverage.sh`
# （`common` 和 `cmd` 逐包语句覆盖率 ≥ 70%）。
#
# 日常目标分别运行，便于从摘要定位失败步骤。
#
# Go 版本跟随 `go.mod` 的 `go` 指令：`setup-go` 的 `go-version-file` 从该文件读取，
# 免得两处版本号各自漂移。

name: ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:
    inputs:
      peer_sha:
        description: "Paired repository full commit SHA (empty uses main)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:

    name: ci (Go)

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        # 跨 workflow 复用模块下载与构建缓存，缓存键跟随 `go.sum`。
        cache-dependency-path: go.sum
    - name: Vet
      run: make vet
    - name: Check formatting with gofmt
      run: make fmt-check
    - name: Test
      run: make test
    - name: Collect coverage and enforce per-package thresholds
      run: make cover-check
    - name: Upload coverage profile
      uses: actions/upload-artifact@v4
      # 即使门槛失败也要留下 profile——覆盖率不够时恰恰最需要看它。若更早的步骤就挂了
      # （比如测试失败），profile 可能压根没生成，这时只警告不再叠加一次失败。
      if: always()
      with:
        name: coverage-profile
        path: coverage.out
        if-no-files-found: warn

  paired-contract:
    name: paired protocol and CLI contracts
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        path: takler-client
        fetch-depth: 0
        persist-credentials: false
    - name: Select peer revision
      id: peer
      env:
        REQUESTED_SHA: ${{ inputs.peer_sha }}
      run: |
        peer_sha="$REQUESTED_SHA"
        if [[ -n "$peer_sha" && ! "$peer_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "Peer revision must be a full lowercase commit SHA" >&2
          exit 1
        fi
        echo "ref=${peer_sha:-main}" >> "$GITHUB_OUTPUT"
        echo "sha=$peer_sha" >> "$GITHUB_OUTPUT"
    - name: Check out paired repository
      uses: actions/checkout@v4
      with:
        repository: cemc-oper/takler
        ref: ${{ steps.peer.outputs.ref }}
        path: takler
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-go@v5
      with:
        go-version-file: takler-client/go.mod
        cache-dependency-path: takler-client/go.sum
    - uses: astral-sh/setup-uv@v10.0.1
      with:
        python-version: "3.11"
        enable-cache: true
        cache-dependency-glob: takler/uv.lock
    - name: Record actual revisions
      run: |
        for repo in takler takler-client; do
          revision="$(git -C "$repo" rev-parse HEAD)"
          echo "$repo: $revision" | tee -a "$GITHUB_STEP_SUMMARY"
        done
    - name: Verify the complete Python and Go pairing
      working-directory: takler-client
      run: make check-paired
